<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Group</title>
    <h:outputStylesheet library="css" name="bootstrap.min.css"/>
</h:head>

<h:body>
    
   <h:form styleClass="d-flex justify-content-end p-3 bg-light">
    <h:panelGroup rendered="#{not empty sessionBean.user}">
        <style>
            .profile-wrapper {
                position: relative;
                display: inline-block;
            }
            .user-card {
                background: #ffffff;
                border: 1px solid #ced4da;
                padding: 8px 20px;
                border-radius: 50px;
                cursor: pointer;
                font-weight: 600;
                color: #2c3e50;
                user-select: none; /* Metnin seçilmesini engeller */
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .user-card:active { background: #f1f1f1; }

            .dropdown-logout {
                display: none; /* Varsayılan olarak kapalı */
                position: absolute;
                top: 110%;
                right: 0;
                min-width: 160px;
                background-color: white;
                box-shadow: 0px 8px 16px rgba(0,0,0,0.15);
                padding: 12px;
                z-index: 1000;
                border-radius: 8px;
                border: 1px solid #eee;
            }
            
            /* Bu sınıf eklendiğinde menü görünür olacak */
            .show-menu {
                display: block !important;
            }
            
            .logout-btn { width: 100%; text-align: center; }
        </style>

        <div class="profile-wrapper">
            <div class="user-card" onclick="toggleMenu(event)">
                <span>👤 #{sessionBean.user.userName} #{sessionBean.user.lastName}</span>
                <small style="font-size: 0.7em; color: #6c757d;">(#{sessionBean.user.group.gname}) ▼</small>
            </div>
            
            <div id="logoutDropdown" class="dropdown-logout">
                <h:commandLink action="#{sessionBean.logout}" 
                               value="Güvenli Çıkış (Exit)" 
                               styleClass="btn btn-danger btn-sm logout-btn" />
            </div>
        </div>

        <script>
            function toggleMenu(event) {
                // Tıklanan yerin dışına tıklayınca kapanması için durdurma
                event.stopPropagation();
                var dropdown = document.getElementById("logoutDropdown");
                dropdown.classList.toggle("show-menu");
            }

            // Sayfada başka bir yere tıklanırsa menüyü kapat
            window.onclick = function(event) {
                var dropdown = document.getElementById("logoutDropdown");
                if (dropdown.classList.contains('show-menu')) {
                    dropdown.classList.remove('show-menu');
                }
            }
        </script>
    </h:panelGroup>
</h:form>
    
    <div class="container">
        
          <div class="row">
                 <h:form>
                    <h:commandButton styleClass="btn btn-outline-primary" action="/panel/category/category?faces-redirect=true" value="Categories"/>
                    <h:commandButton styleClass="btn btn-outline-secondary" action="/panel/group/group?faces-redirect=true" value="Group"/>
                    <h:commandButton styleClass="btn btn-outline-primary" action="/panel/user/user?faces-redirect=true" value="User"/>
                    <h:commandButton styleClass="btn btn-outline-primary" action="/panel/news_category/news_category?faces-redirect=true" value="News"/>
                    <h:commandButton styleClass="btn btn-outline-primary" action="/panel/summarizition/summarizition?faces-redirect=true" value="Summary"/>
                    <h:commandButton styleClass="btn btn-outline-primary" action="/panel/panel?faces-redirect=true" value="Ana Sayfa"/> 
                </h:form>
            </div>
        
        <div class="row">

            <div class="col">
                <h:form>
                    <table class="table table-striped table-hover">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Group Name</th>
                            <th>Created</th>
                            <th>Updated</th>
                            <th>Admin</th>
                        </tr>
                        </thead>

                        <tbody>
                        <ui:repeat value="#{groupBean.list}" var="e">

                            <tr>
                                <td>#{e.id}</td>

                                <td>
                                    <h:commandLink action="#{groupBean.setEntitiy(e)}"
                                                   value="#{e.gname}"/>
                                </td>

                                <td>#{e.created}</td>
                                <td>#{e.updated}</td>
                                <td></td>
                            </tr>

                        </ui:repeat>
                        </tbody>
                        
                        <tfoot>
                            
                            <tr>
                                <h3>Page :#{groupBean.page}/ #{groupBean.pageCount}</h3>
                            <h:commandButton styleClass="btn btn-primary " action="#{groupBean.previous()}" value="previous"/>
                            <h:commandButton styleClass="btn btn-primary " action="#{groupBean.next()}" value="next"/> 
                            </tr>
                            
                        </tfoot>
                        
                       
                    </table>
                </h:form>
            </div>

            <div class="col">
                <h:form>
                    <div class="mb-3">
                        <label>Group Name</label>
                        <h:inputText value="#{groupBean.entitiy.gname}" styleClass="form-control"/>
                    </div>

                    <div class="mb-3">
                        <h:commandButton styleClass="btn btn-success"
                                         rendered="#{groupBean.entitiy.id==null}"
                                         action="#{groupBean.create}" value="Create"/>

                        <h:commandButton styleClass="btn btn-secondary"
                                         rendered="#{groupBean.entitiy.id!=null}"
                                         action="#{groupBean.clearForm}" value="Clear Form"/>

                        <h:commandButton styleClass="btn btn-primary"
                                         rendered="#{groupBean.entitiy.id!=null}"
                                         action="#{groupBean.update}" value="Update"/>

                        <h:commandButton styleClass="btn btn-danger"
                                         rendered="#{groupBean.entitiy.id!=null}"
                                         action="#{groupBean.delete}" value="Delete"/>
                    </div>
                </h:form>
            </div>

        </div>
    </div>
    
     
</h:body>

</html>
