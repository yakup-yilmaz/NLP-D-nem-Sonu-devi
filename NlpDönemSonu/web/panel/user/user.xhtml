<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>Facelet Title</title>
        <h:outputStylesheet library="css" name="bootstrap.min.css"/>
    </h:head>

    <h:body>

        <h:form styleClass="d-flex justify-content-end p-3 bg-light">
            <h:panelGroup rendered="#{not empty sessionBean.user}">
                <h:commandLink action="#{sessionBean.logout}" value="Exit" styleClass="btn btn-outline-danger btn-sm"/>
            </h:panelGroup>
        </h:form>

        <div class="container">

            <div class="row">
                <h:form>
                    <h:commandButton styleClass="btn btn-outline-primary" action="/panel/category/category?faces-redirect=true" value="Categories"/>
                    <h:commandButton styleClass="btn btn-outline-primary" action="/panel/group/group?faces-redirect=true" value="Group"/>
                    <h:commandButton styleClass="btn btn-outline-secondary" action="/panel/user/user?faces-redirect=true" value="User"/>
                    <h:commandButton styleClass="btn btn-outline-primary" action="/panel/news_category/news_category?faces-redirect=true" value="News"/>
                    <h:commandButton styleClass="btn btn-outline-primary" action="/panel/summarizition/summarizition?faces-redirect=true" value="Summary"/>
                    <h:commandButton styleClass="btn btn-outline-primary" action="/panel/panel?faces-redirect=true" value="Ana Sayfa"/> 
                </h:form>
            </div>

            <div class="row">

                <div class="col">
                    <h:form>                    
                        <table class="table table-striped table-hover">

                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>İsim</th>
                                    <th>Soyisim</th>
                                    <th>Email</th>
                                    <th>Group</th>
                                    <th>İlgi Alanlari</th>
                                </tr>
                            </thead>

                            <tbody>
                                <ui:repeat value="#{userBean.list}" var="e">
                                    <tr>
                                        <td>#{e.id}</td>

                                        <td>
                                            #{e.userName}
                                        </td>

                                        <td>
                                            #{e.lastName}
                                        </td>

                                        <td>
                                            <h:commandLink action="#{userBean.setEntitiy(e)}" value=" #{e.email}"/>      
                                        </td>

                                        <td>
                                            #{e.group.gname}
                                        </td>

                                        <td>
                                            <ul>
                                                <ui:repeat value="#{e.category}" var="c">
                                                    <li>#{c.title}</li>
                                                </ui:repeat>
                                            </ul>
                                        </td>                                           

                                        <td></td>
                                    </tr>
                                </ui:repeat>
                            </tbody>

                        </table>
                    </h:form>  
                </div>

                <div class="col">

                    <h:form>

                        <div class="mb-3">
                            <label>Group</label>
                            <h:selectOneMenu styleClass="form-select" value="#{userBean.entitiy.group}" converter="groupConverter">
                                <f:selectItems value="#{groupBean.list}" var="g" itemLabel="#{g.gname}" itemValue="#{g}"/>
                            </h:selectOneMenu>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">İlgi Alanları</label>
                            <h:selectManyMenu styleClass="form-select" value="#{userBean.entitiy.category}" converter="categoryConverter">
                                <f:selectItems value="#{categoryBean.list}" var="c" itemValue="#{c}" itemLabel="#{c.title}"/>
                            </h:selectManyMenu>
                        </div>

                        <div class="mb-3">
                            <label>Email</label>
                            <h:inputText value="#{userBean.entitiy.email}" styleClass="form-control"/>
                        </div>

                        <div class="mb-3">
                            <label>İsim</label>
                            <h:inputText value="#{userBean.entitiy.userName}" styleClass="form-control"/>
                        </div>

                        <div class="mb-3">
                            <label>Soyisim</label>
                            <h:inputText value="#{userBean.entitiy.lastName}" styleClass="form-control"/>
                        </div>

                        <div class="mb-3">
                            <label>Pass</label>
                            <h:inputText value="#{userBean.entitiy.pass}" styleClass="form-control"/>
                        </div>

                        <div class="mb-3">
                            <h:commandButton styleClass="btn btn-success" rendered="#{userBean.entitiy.id==null}" action="#{userBean.create}" value="Create"/>
                            <h:commandButton styleClass="btn btn-secondary" rendered="#{userBean.entitiy.id!=null}" action="#{userBean.clearForm}" value="Clear Form"/>
                            <h:commandButton styleClass="btn btn-primary" rendered="#{userBean.entitiy.id!=null}" action="#{userBean.update}" value="Update"/>
                            <h:commandButton styleClass="btn btn-danger" rendered="#{userBean.entitiy.id!=null}" action="#{userBean.delete}" value="Delete"/>
                        </div>

                    </h:form>

                </div>
            </div>

        </div>

       

    </h:body>

</html>
