<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Login</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <style>
        body {
            background: #f0f2f5;
        }
        .login-card {
            max-width: 400px;
            margin: 80px auto;
            padding: 40px 30px 70px 30px; /* alt padding artırıldı */
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
        }
        .form-label {
            font-weight: 600;
        }
        .signup-text {
            margin-top: 25px;
            text-align: center;
            font-size: 0.9rem;
            color: #0d6efd;
        }
    </style>

</h:head>

<h:body>

<div class="container">
    <div class="login-card bg-white">

        <h2 class="text-center mb-4">Login</h2>

        <!-- Login Form -->
        <h:form>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <h:inputText value="#{sessionBean.email}" styleClass="form-control"/>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <h:inputText value="#{sessionBean.pass}" type="password" styleClass="form-control"/>
            </div>

            <h:commandButton action="#{sessionBean.login}" 
                             value="Login" 
                             styleClass="btn btn-primary w-100"/>
        </h:form>

       

        <h:messages style="margin-top:15px; color:red;"/>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</h:body>
</html>
