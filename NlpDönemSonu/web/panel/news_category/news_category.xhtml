<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>Facelet Title</title>
        <h:outputStylesheet library="css" name="bootstrap.min.css"/>
        <style>
            /* Content sütunu için max-height ve scroll */
            .content-cell {
                max-height: 100px;
                overflow-y: auto;
                word-wrap: break-word;
            }
        </style>
    </h:head>

    <h:body>
        
        <h:form styleClass="d-flex justify-content-end p-3 bg-light">
    <h:panelGroup rendered="#{not empty sessionBean.user}">
        <style>
            .profile-wrapper {
                position: relative;
                display: inline-block;
            }
            .user-card {
                background: #ffffff;
                border: 1px solid #ced4da;
                padding: 8px 20px;
                border-radius: 50px;
                cursor: pointer;
                font-weight: 600;
                color: #2c3e50;
                user-select: none; /* Metnin seçilmesini engeller */
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .user-card:active { background: #f1f1f1; }

            .dropdown-logout {
                display: none; /* Varsayılan olarak kapalı */
                position: absolute;
                top: 110%;
                right: 0;
                min-width: 160px;
                background-color: white;
                box-shadow: 0px 8px 16px rgba(0,0,0,0.15);
                padding: 12px;
                z-index: 1000;
                border-radius: 8px;
                border: 1px solid #eee;
            }
            
            /* Bu sınıf eklendiğinde menü görünür olacak */
            .show-menu {
                display: block !important;
            }
            
            .logout-btn { width: 100%; text-align: center; }
        </style>

        <div class="profile-wrapper">
            <div class="user-card" onclick="toggleMenu(event)">
                <span>👤 #{sessionBean.user.userName} #{sessionBean.user.lastName}</span>
                <small style="font-size: 0.7em; color: #6c757d;">(#{sessionBean.user.group.gname}) ▼</small>
            </div>
            
            <div id="logoutDropdown" class="dropdown-logout">
                <h:commandLink action="#{sessionBean.logout}" 
                               value="Güvenli Çıkış (Exit)" 
                               styleClass="btn btn-danger btn-sm logout-btn" />
            </div>
        </div>

        <script>
            function toggleMenu(event) {
                // Tıklanan yerin dışına tıklayınca kapanması için durdurma
                event.stopPropagation();
                var dropdown = document.getElementById("logoutDropdown");
                dropdown.classList.toggle("show-menu");
            }

            // Sayfada başka bir yere tıklanırsa menüyü kapat
            window.onclick = function(event) {
                var dropdown = document.getElementById("logoutDropdown");
                if (dropdown.classList.contains('show-menu')) {
                    dropdown.classList.remove('show-menu');
                }
            }
        </script>
    </h:panelGroup>
</h:form>
        
        <div class="container">

            <div class="row">
                
                 <h:form>
                    <h:commandButton styleClass="btn btn-outline-primary" action="/panel/category/category?faces-redirect=true" value="Categories"/>
                    <h:commandButton styleClass="btn btn-outline-primary" action="/panel/group/group?faces-redirect=true" value="Group"/>
                    <h:commandButton styleClass="btn btn-outline-primary" action="/panel/user/user?faces-redirect=true" value="User"/>
                    <h:commandButton styleClass="btn btn-outline-secondary" action="/panel/news_category/news_category?faces-redirect=true" value="News"/>
                    <h:commandButton styleClass="btn btn-outline-primary" action="/panel/summarizition/summarizition?faces-redirect=true" value="Summary"/>
                    <h:commandButton styleClass="btn btn-outline-primary" action="/panel/panel?faces-redirect=true" value="Ana Sayfa"/> 
                </h:form>
            </div>

            <div class="row">
                <div class="col">
                    <h:form>                    
                        <table class="table table-striped table-hover table-bordered">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Title</th>
                                    <th>Category</th>
                                    <th>Content</th>
                                    <th>Admin</th>
                                </tr>
                            </thead>
                            <tbody>
                                <ui:repeat value="#{newsBean.list}" var="e">
                                    <tr>
                                        <td>#{e.id}</td>
                                        <td>
                                            <h:commandLink action="#{newsBean.setEntity(e)}" value="#{e.title}"/>      
                                        </td>
                                        <td>#{e.category.title}</td>
                                        <td class="content-cell">#{e.text}</td>
                                        <td></td> <!-- Admin sütunu artık boş -->
                                    </tr>
                                </ui:repeat>
                            </tbody>
                            
                             <tfoot>
                            
                            <tr>
                                <h3>Page :#{newsBean.page}/ #{newsBean.pageCount}</h3>
                                <h:commandButton styleClass="btn btn-primary " action="#{newsBean.previous()}" value="previous"/>
                                <h:commandButton styleClass="btn btn-primary " action="#{newsBean.next()}" value="next"/> 
                            </tr>
                            
                        </tfoot>
                        </table>
                    </h:form>  
                </div>

                <div class="col">
                    <h:form>
                        <div class="mb-3">
                            <label>Haber Kategorisi</label>
                            <h:selectOneMenu styleClass="form-select" value="#{newsBean.entity.category}" converter="categoryConverter">
                                <f:selectItems value="#{categoryBean.list}" var="g" itemLabel="#{g.title}" itemValue="#{g}"/>
                            </h:selectOneMenu>
                        </div>

                        <div class="mb-3">
                            <label>Haber Başlığı</label>
                            <h:inputText value="#{newsBean.entity.title}" styleClass="form-control"/>
                        </div>

                        <div class="mb-3">
                            <label>Haber İçeriği</label>
                            <h:inputTextarea value="#{newsBean.entity.text}" styleClass="form-control"/>
                        </div>

                        <div class="mb-3 d-flex gap-2">
                            <h:commandButton styleClass="btn btn-success" rendered="#{newsBean.entity.id==null}" action="#{newsBean.create}" value="Create"/>
                            <h:commandButton styleClass="btn btn-secondary" rendered="#{newsBean.entity.id!=null}" action="#{newsBean.clearForm}" value="Clear Form"/>
                            <h:commandButton styleClass="btn btn-primary" rendered="#{newsBean.entity.id!=null}" action="#{newsBean.update}" value="Update"/>
                            <h:commandButton styleClass="btn btn-danger" rendered="#{newsBean.entity.id!=null}" action="#{newsBean.delete}" value="Delete"/>
                        </div>
                    </h:form>
                </div>
            </div>
        </div>
        
         
    </h:body>
</html>
